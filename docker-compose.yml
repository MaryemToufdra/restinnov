services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: restinnov-app
    container_name: restinnov-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      # Anonymous volume: keeps the container's own vendor/ (installed by
      # entrypoint.sh, built for this Linux image) from being shadowed by
      # whatever the bind-mounted host directory happens to contain (e.g.
      # a vendor/ installed on a different OS). Reset with `docker compose
      # down -v` if you ever need to force a clean reinstall.
      - /var/www/vendor
    environment:
      # Forced regardless of the host's .env: Laravel's dotenv loader is
      # immutable and never overwrites a variable that's already set in
      # the process environment, so these always win over whatever
      # DB_CONNECTION/DB_HOST/etc. happen to be in the bind-mounted .env
      # (e.g. a host .env configured for a local XAMPP/MySQL setup). See
      # README-DOCKER.md for why the host .env never needs editing.
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: restinnov
      DB_USERNAME: restinnov
      DB_PASSWORD: restinnov
    depends_on:
      db:
        condition: service_healthy
    networks:
      - restinnov-network
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1',9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 90s

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: restinnov-app
    container_name: restinnov-scheduler
    restart: unless-stopped
    working_dir: /var/www
    # Runs the Laravel scheduler continuously (checks every minute for due
    # jobs) so `sejours:activer-en-cours` (see routes/console.php) actually
    # fires -- `schedule:work` is the long-running dev equivalent of a real
    # cron entry. `sejours:checkout-automatique` is defined but its schedule
    # is commented out (décision du DG: checkout is manager-only now), so it
    # no longer fires here either. Keeps the same entrypoint.sh as "app"
    # (composer install, migrate, wait-for-db -- all idempotent) so this
    # container's own anonymous vendor/ volume gets populated too; only the
    # final command differs.
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - .:/var/www
      - /var/www/vendor
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: restinnov
      DB_USERNAME: restinnov
      DB_PASSWORD: restinnov
    depends_on:
      app:
        condition: service_healthy
    networks:
      - restinnov-network

  nginx:
    image: nginx:alpine
    container_name: restinnov-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - restinnov-network

  db:
    image: mysql:8.0
    container_name: restinnov-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: restinnov
      MYSQL_USER: restinnov
      MYSQL_PASSWORD: restinnov
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - restinnov-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: restinnov-frontend
    container_name: restinnov-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      # Anonymous volume: keeps the container's own node_modules (installed
      # by entrypoint.sh, with Linux native binaries e.g. lightningcss)
      # from being shadowed by the host's frontend/node_modules, which on
      # Windows/macOS hosts contains binaries built for a different OS and
      # will crash Vite (e.g. "Cannot find module lightningcss.linux-x64-
      # musl.node"). Reset with `docker compose down -v` if you ever need
      # to force a clean reinstall.
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    networks:
      - restinnov-network

networks:
  restinnov-network:
    driver: bridge

volumes:
  dbdata:
