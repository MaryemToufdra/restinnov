services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: restinnov-app
    container_name: restinnov-app
    restart: unless-stopped
    volumes:
      - .:/var/www
    networks:
      - restinnov-network
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: restinnov-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: restinnov
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - restinnov-network

  nginx:
    image: nginx:alpine
    container_name: restinnov-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
      - "5173:5173"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - restinnov-network

networks:
  restinnov-network:
    driver: bridge

volumes:
  dbdata: